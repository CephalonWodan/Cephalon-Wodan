name: Warframe Data Auto-Sync

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  COREPACK_ENABLE_PROJECT_SPEC: "0"

jobs:
  sync-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Enable pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install YouTube metadata collector
        run: python -m pip install --user --break-system-packages yt-dlp

      - name: Discover item names from WFCD
        run: node scripts/prepare-sync-input.mjs

      - name: Collect recent expert creator videos
        run: pnpm run youtube:collect

      - name: Extract public video subtitles
        run: pnpm run youtube:transcripts

      - name: Collect expert community guides
        run: pnpm run community:guides

      - name: Validate YouTube and community manifests
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("data/youtube-videos.json", "utf8"));
            const transcripts = JSON.parse(fs.readFileSync("data/youtube-transcripts.json", "utf8"));
            const guides = JSON.parse(fs.readFileSync("data/community-guides.json", "utf8"));
            const cutoff = new Date(manifest.cutoff);
            const creators = new Set(manifest.videos.map(video => video.creator));
            if (creators.size !== 8 || manifest.channelCount !== 9 || !manifest.videos.length) process.exit(1);
            if (manifest.videos.some(video => !video.id || !video.url || new Date(video.publishedAt) < cutoff)) process.exit(1);
            if (transcripts.videoCount !== manifest.videoCount) process.exit(1);
            if (!Array.isArray(guides.documents)) process.exit(1);
            console.log(JSON.stringify({ videos: manifest.videoCount, creators: creators.size, channels: manifest.channelCount, transcripts: transcripts.transcriptCount, guides: guides.documentCount, enumeration: manifest.enumeration }, null, 2));
          '

      - name: Enrich new and changed items from Warframe Wiki
        run: node scripts/sync-warframe-data.js

      - name: Build versioned RAG index
        run: pnpm run rag:index

      - name: Validate generated report
        run: |
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("data-sync-report.json", "utf8"));
            if (report.status !== "success") process.exit(1);
            for (const item of report.processedItems || []) {
              if (!item.name || !["validated", "review_required", "rejected"].includes(item.validationStatus)) process.exit(1);
            }
            console.log(JSON.stringify({ processed: report.processedCount, stats: report.itemsWithStats, review: report.reviewRequiredCount, images: report.imagesDownloaded + report.imagesCached }, null, 2));
          '

      - name: Check for data changes
        id: git-check
        run: |
          git status --short
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request with updates
        if: steps.git-check.outputs.changes_detected == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(data): sync Warframe items and expert community sources"
          title: "Automated Warframe data, Wiki and expert community sync"
          body: |
            Cette PR est générée automatiquement à partir des exports WFCD, du Wiki Warframe et des sources communautaires expertes sélectionnées.

            Sources YouTube : TheKengineer, Master Elmo, Endryx_ow, Vu Thang, MH Blacky, PANDAAHH (2 chaînes), Leamxp et LeyzarGamingViews.

            Sources guides : WFPedia et les guides/builds du site Pandaahh.

            Les vidéos et guides sont indexés comme références communautaires, jamais comme statistiques officielles. Les données factuelles restent validées par le Codex/Wiki.
          branch: automated-data-sync
          base: main
          delete-branch: true
          add-paths: |
            data/data-sync-input.json
            data/wiki-sync-state.json
            data/wiki-enrichment.json
            data/youtube-videos.json
            data/youtube-transcripts.json
            data/community-guides.json
            data/rag-index.json
            server/rag-index.generated.ts
            data-sync-report.json
            client/public/assets/wiki/
