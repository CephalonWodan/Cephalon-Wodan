name: Warframe Data Full Auto-Sync & Merge

on:
  schedule:
    - cron: '0 8 * * 1' # Chaque lundi à 8h00 UTC
  workflow_dispatch:

jobs:
  auto-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Run automated data sync and validation
        run: |
          node scripts/auto-sync-data.mjs

      - name: Run type check and production build
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm run check
          pnpm run build

      - name: Commit and push updates if any
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Warframe Bot Auto-Sync"
          git config --global user.action "bot@users.noreply.github.com"
          git add sync-report.json client/src/lib/warframe-data-full.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): automated weekly warframe dataset sync [skip ci]" && git push origin main)
